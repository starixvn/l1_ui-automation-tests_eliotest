variables:
  GIT_CLEAN_FLAGS: none
  ALLURE_URL: "http://10.70.70.120:8080/api/result"
  HEADER: "Content-Type: multipart/form-data;accept: */*"

stages:
  - build
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm
  - rm -rf allure-results
  - rm -f allure-results.zip

docker-build:
  image: hub.lumigame.com/base/docker:20.10.7
  tags:
    - docker
  stage: build

  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon-base/automation-tests-game-$GAMEID
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL
  script:
    - docker build --build-arg gameId=$GAMEID --pull -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - when: never

include: "**/.gitlab-ci.yml"

e2etest:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:e2e --env=$ENV --gameid=$GAMEID --project=$STACK_NAME --jackpot=$jackpot

  retry: 2
  rules:
    - if: $MODE == "E2E"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

gameguidetest:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - auto-test-prod
  script:
    - rm -r *
    - cp -r /app/* ./
    - npm run test:guide --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
  after_script:
    - du -hs /ms-playwright/*
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "GUIDE"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

e2etestmac:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:e2e --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
  after_script:
    - echo "$CI_JOB_ID"
    - npm run sendresult --env=$ENV --gameid=$GAMEID --pipelineid=$CI_JOB_ID
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "E2E1"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

smoketest:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:smoke --env=$ENV --gameid=$GAMEID --project=$STACK_NAME --trackDownload=$PERFORMANCE
  after_script:
    - if [ "$UPLOAD_ALLURE_RP" = "true" ]; then
      zip -r allure-results.zip allure-results &&
      curl -X POST "${ALLURE_URL}" -H "${HEADER}" -F 'allureResults=@allure-results.zip;type=application/x-zip-compressed';
      fi

  retry: 2
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKE"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

smoketestOther:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run test:smoke:$MODE --env=$ENV --gameid=$GAMEID --project=$STACK_NAME --trackDownload=$PERFORMANCE
  after_script:
    - if [ "$UPLOAD_ALLURE_RP" = "true" ]; then
      zip -r allure-results.zip allure-results &&
      curl -X POST "${ALLURE_URL}" -H "${HEADER}" -F 'allureResults=@allure-results.zip;type=application/x-zip-compressed';
      fi
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE != "SMOKE" &&  $MODE != "E2E" &&  $TEST != "ALLURE"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - test-results
    when: always
    expire_in: 1 day

generate-allure-report:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-0
  stage: test
  tags:
    - e2e-test
  script:
    - cd tests
    - npm run allure
  retry: 0
  rules:
    - if: $TRIGGER == "true" && $TEST == "ALLURE"
    - when: never
